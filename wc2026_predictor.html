<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA World Cup 2026 Predictor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #C9A84C;
    --gold-light: #E8C97A;
    --gold-dark: #8B6914;
    --black: #0A0A0A;
    --dark: #111111;
    --dark2: #1A1A1A;
    --dark3: #242424;
    --dark4: #2E2E2E;
    --white: #F5F5F0;
    --muted: #888880;
    --green: #1D9E75;
    --blue: #378ADD;
    --amber: #EF9F27;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem 1.5rem;
    position: relative;
    border-bottom: 1px solid #2A2A2A;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(201,168,76,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-logo {
    width: 110px;
    height: auto;
    filter: drop-shadow(0 0 24px rgba(201,168,76,0.35));
    margin-bottom: 1rem;
  }
  .hero-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.2rem, 6vw, 3.8rem);
    letter-spacing: 0.06em;
    color: var(--white);
    text-align: center;
    line-height: 1;
  }
  .hero-sub {
    font-size: 0.78rem;
    font-weight: 300;
    color: var(--gold);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-top: 0.4rem;
  }

  /* PROGRESS BAR */
  .progress-bar {
    display: flex;
    gap: 0;
    max-width: 820px;
    margin: 1.5rem auto 0;
    width: 100%;
    padding: 0 1rem;
  }
  .prog-step {
    flex: 1;
    text-align: center;
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 7px 4px;
    color: #555;
    border-bottom: 2px solid #2A2A2A;
    transition: all 0.3s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .prog-step.done { color: var(--gold-dark); border-bottom-color: var(--gold-dark); }
  .prog-step.active { color: var(--gold); border-bottom-color: var(--gold); }

  /* MAIN CONTAINER */
  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 2rem 1rem 3rem;
  }

  .section-eyebrow {
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.5rem;
  }
  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    letter-spacing: 0.04em;
    color: var(--white);
    margin-bottom: 0.35rem;
  }
  .section-desc {
    font-size: 0.82rem;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 2rem;
    max-width: 560px;
  }

  /* GROUP GRID */
  .group-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 12px;
  }
  .group-card {
    background: var(--dark2);
    border: 1px solid #2A2A2A;
    border-radius: 10px;
    overflow: hidden;
  }
  .group-header {
    background: var(--dark3);
    border-bottom: 1px solid #2A2A2A;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .group-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.1em;
    color: var(--gold);
  }
  .group-done-badge {
    font-size: 0.65rem;
    color: var(--green);
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .group-done-badge.visible { opacity: 1; }
  .group-body { padding: 8px; }
  .team-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
    border: 1px solid transparent;
    margin-bottom: 3px;
    user-select: none;
  }
  .team-row:last-child { margin-bottom: 0; }
  .team-row:hover { background: #2A2A2A; }
  .team-row.pos-1 { background: rgba(29,158,117,0.12); border-color: rgba(29,158,117,0.3); }
  .team-row.pos-2 { background: rgba(55,138,221,0.1); border-color: rgba(55,138,221,0.25); }
  .team-row.pos-3 { background: rgba(201,168,76,0.1); border-color: rgba(201,168,76,0.25); }
  .team-flag { font-size: 1.2rem; width: 26px; text-align: center; flex-shrink: 0; }
  .team-name { font-size: 0.82rem; flex: 1; color: var(--white); font-weight: 400; }
  .rank-badge {
    width: 22px; height: 22px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem;
    font-weight: 700;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .rank-badge.empty { background: #2A2A2A; color: #555; }
  .rank-badge.r1 { background: var(--green); color: #fff; }
  .rank-badge.r2 { background: var(--blue); color: #fff; }
  .rank-badge.r3 { background: var(--gold); color: #000; }

  /* THIRD PLACE GRID */
  .third-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
  }
  .third-card {
    background: var(--dark2);
    border: 1px solid #2A2A2A;
    border-radius: 10px;
    padding: 14px 12px;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .third-card:hover { background: var(--dark3); border-color: #3A3A3A; }
  .third-card.chosen {
    background: rgba(201,168,76,0.1);
    border-color: var(--gold);
  }
  .third-card .tc-flag { font-size: 1.8rem; margin-bottom: 6px; }
  .third-card .tc-name { font-size: 0.82rem; color: var(--white); font-weight: 500; }
  .third-card .tc-from { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
  .third-card .tc-check {
    float: right;
    color: var(--gold);
    font-size: 1rem;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .third-card.chosen .tc-check { opacity: 1; }

  /* KNOCKOUT MATCHES */
  .round-section { margin-bottom: 2.5rem; }
  .matches-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 10px;
  }
  .match-card {
    background: var(--dark2);
    border: 1px solid #2A2A2A;
    border-radius: 10px;
    overflow: hidden;
  }
  .match-id {
    background: var(--dark3);
    border-bottom: 1px solid #2A2A2A;
    padding: 5px 12px;
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .match-body { padding: 6px 8px; }
  .match-team {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid transparent;
    margin-bottom: 3px;
    user-select: none;
  }
  .match-team:last-child { margin-bottom: 0; }
  .match-team:hover { background: #2A2A2A; }
  .match-team.winner {
    background: rgba(29,158,117,0.12);
    border-color: rgba(29,158,117,0.4);
  }
  .match-team.winner .mt-name { color: #4ECDA4; font-weight: 600; }
  .match-team.tbd { cursor: default; opacity: 0.4; }
  .match-team.tbd:hover { background: transparent; }
  .mt-flag { font-size: 1.1rem; width: 24px; text-align: center; flex-shrink: 0; }
  .mt-name { font-size: 0.82rem; color: var(--white); flex: 1; }
  .mt-check { font-size: 0.8rem; color: var(--green); opacity: 0; }
  .match-team.winner .mt-check { opacity: 1; }
  .vs-line {
    text-align: center;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: #444;
    padding: 1px 0;
  }

  /* COUNTER */
  .counter-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--dark3);
    border: 1px solid #2A2A2A;
    border-radius: 100px;
    padding: 5px 14px;
    font-size: 0.76rem;
    color: var(--muted);
    margin-bottom: 1.5rem;
  }
  .counter-chip strong { color: var(--gold); }

  /* BUTTONS */
  .btn-bar {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 2rem;
    flex-wrap: wrap;
  }
  .btn {
    padding: 10px 24px;
    border-radius: 6px;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid #3A3A3A;
    background: transparent;
    color: var(--muted);
  }
  .btn:hover { background: var(--dark3); color: var(--white); }
  .btn-gold {
    background: var(--gold);
    color: #000;
    border-color: var(--gold-light);
    font-weight: 700;
  }
  .btn-gold:hover { background: var(--gold-light); }
  .btn-gold:disabled { opacity: 0.35; cursor: not-allowed; }

  /* WINNER SCREEN */
  .winner-screen {
    text-align: center;
    padding: 3rem 1rem;
  }
  .winner-trophy { font-size: 5rem; margin-bottom: 1rem; }
  .winner-flag { font-size: 4rem; margin-bottom: 0.75rem; }
  .winner-team {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3.5rem;
    letter-spacing: 0.06em;
    color: var(--gold);
    text-shadow: 0 0 40px rgba(201,168,76,0.4);
  }
  .winner-label {
    font-size: 0.75rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 0.5rem;
    margin-bottom: 2rem;
  }
  .winner-divider {
    width: 60px;
    height: 1px;
    background: var(--gold-dark);
    margin: 1.5rem auto;
  }

  /* UTILITY */
  .hidden { display: none !important; }
  .err-msg {
    font-size: 0.78rem;
    color: #E24B4A;
    margin-top: 0.5rem;
  }
  .info-note {
    font-size: 0.78rem;
    color: var(--muted);
    background: var(--dark2);
    border: 1px solid #2A2A2A;
    border-left: 3px solid var(--gold-dark);
    border-radius: 4px;
    padding: 10px 14px;
    margin-bottom: 1.5rem;
    line-height: 1.5;
  }

  @media (max-width: 540px) {
    .group-grid { grid-template-columns: 1fr; }
    .third-grid { grid-template-columns: repeat(2, 1fr); }
    .matches-grid { grid-template-columns: 1fr; }
    .progress-bar { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; }
  }
</style>
</head>

const GROUPS = {
  A:["Mexico","South Africa","South Korea","Czechia"],
  B:["Canada","Switzerland","Qatar","Bosnia and Herzegovina"],
  C:["Brazil","Morocco","Scotland","Haiti"],
  D:["United States","Paraguay","Australia","Türkiye"],
  E:["Germany","Ecuador","Ivory Coast","Curaçao"],
  F:["Netherlands","Sweden","Japan","Tunisia"],
  G:["Belgium","Egypt","Iran","New Zealand"],
  H:["Spain","Uruguay","Saudi Arabia","Cape Verde"],
  I:["France","Senegal","Norway","Iraq"],
  J:["Argentina","Austria","Algeria","Jordan"],
  K:["Portugal","Colombia","Uzbekistan","DR Congo"],
  L:["England","Croatia","Ghana","Panama"]
};
const GK = Object.keys(GROUPS);

const PHASES = [
  {id:'groups', label:'Group Stage'},
  {id:'third',  label:'Best 3rd'},
  {id:'r32',    label:'Rd of 32'},
  {id:'r16',    label:'Rd of 16'},
  {id:'qf',     label:'Quarters'},
  {id:'sf',     label:'Semis'},
  {id:'final',  label:'Final'},
  {id:'done',   label:'Champion'}
];

const S = {
  phase: 'groups',
  rankings: {}, // {A: [1st,2nd,3rd,4th]}
  thirds: [],
  r32w: {}, r16w: {}, qfw: {}, sfw: {}, champion: null
};

const f = t => FLAGS[t] || '🏳️';
const esc = s => s.replace(/'/g, "\'");

function gw(g){ return (S.rankings[g]||[])[0]||'TBD'; }
function gr(g){ return (S.rankings[g]||[])[1]||'TBD'; }
function gt(g){ return (S.rankings[g]||[])[2]||null; }

function allGroupsDone(){ return GK.every(g=>(S.rankings[g]||[]).length >= 3); }
function groupProgress(){ return GK.filter(g=>(S.rankings[g]||[]).length >= 3).length; }

function cycleTeam(group, team){
  if(!S.rankings[group]) S.rankings[group]=[];
  const r = S.rankings[group];
  const i = r.indexOf(team);
  if(i === -1){
    if(r.length < 3){ r.push(team); }
  } else {
    r.splice(i,1);
  }
  render();
}

function toggleThird(team){
  const i = S.thirds.indexOf(team);
  if(i===-1){ S.thirds.push(team); }
  else { S.thirds.splice(i,1); }
  render();
}

function pickWinner(bucket, key, team){
  if(bucket==='r32') S.r32w[key]=team;
  else if(bucket==='r16') S.r16w[key]=team;
  else if(bucket==='qf') S.qfw[key]=team;
  else if(bucket==='sf') S.sfw[key]=team;
  else if(bucket==='final'){ S.champion=team; S.phase='done'; }
  render();
}

function buildR32(){
  const t3 = [...S.thirds];
  let ti = 0;
  const n3 = () => t3[ti++] || 'TBD';
  return {
    M73:[gr('A'),gr('B')],
    M74:[gw('E'),n3()],
    M75:[gw('F'),gr('C')],
    M76:[gw('C'),gr('F')],
    M77:[gw('I'),n3()],
    M78:[gr('E'),gr('I')],
    M79:[gw('A'),n3()],
    M80:[gw('L'),n3()],
    M81:[gw('D'),n3()],
    M82:[gw('G'),n3()],
    M83:[gw('H'),gr('J')],
    M84:[gw('J'),gr('H')],
    M85:[gw('B'),n3()],
    M86:[gr('D'),gr('G')],
    M87:[gw('K'),n3()],
    M88:[gr('K'),gr('L')]
  };
}

function buildR16(){
  const w = k => S.r32w[k]||'TBD';
  return {
    R16_1:[w('M73'),w('M74')],R16_2:[w('M75'),w('M76')],
    R16_3:[w('M77'),w('M78')],R16_4:[w('M79'),w('M80')],
    R16_5:[w('M81'),w('M82')],R16_6:[w('M83'),w('M84')],
    R16_7:[w('M85'),w('M86')],R16_8:[w('M87'),w('M88')]
  };
}
function buildQF(){
  const w = k => S.r16w[k]||'TBD';
  return {
    QF1:[w('R16_1'),w('R16_2')],QF2:[w('R16_3'),w('R16_4')],
    QF3:[w('R16_5'),w('R16_6')],QF4:[w('R16_7'),w('R16_8')]
  };
}
function buildSF(){
  const w = k => S.qfw[k]||'TBD';
  return { SF1:[w('QF1'),w('QF2')], SF2:[w('QF3'),w('QF4')] };
}
function buildFinal(){
  const w = k => S.sfw[k]||'TBD';
  return { FINAL:[w('SF1'),w('SF2')] };
}

function allDone(matches, wins){
  return Object.keys(matches).every(k => wins[k]);
}

/* ─── RENDERERS ─── */

function renderProgress(){
  const order = PHASES.map(p=>p.id);
  const cur = order.indexOf(S.phase);
  return PHASES.map((p,i) => {
    let cls = 'prog-step';
    if(i < cur) cls += ' done';
    else if(i === cur) cls += ' active';
    return `<span class="${cls}">${p.label}</span>`;
  }).join('');
}

function renderGroups(){
  const done = groupProgress();
  let h = `
    <div class="section-eyebrow">Phase 1</div>
    <div class="section-title">Group Stage</div>
    <div class="section-desc">Click teams to rank them: first click = 1st, second = 2nd, third = 3rd. Click again to remove. Complete all 12 groups to continue.</div>
    <div class="counter-chip"><strong>${done}/12</strong> groups ranked</div>
    <div class="group-grid">`;

  GK.forEach(g => {
    const teams = GROUPS[g];
    const ranked = S.rankings[g] || [];
    const isDone = ranked.length >= 3;
    h += `<div class="group-card">
      <div class="group-header">
        <span class="group-label">Group ${g}</span>
        <span class="group-done-badge ${isDone?'visible':''}">✓ Done</span>
      </div>
      <div class="group-body">`;
    teams.forEach(t => {
      const pos = (ranked.indexOf(t) + 1) || 0;
      const posClass = pos > 0 ? `pos-${pos}` : '';
      const badgeClass = pos > 0 ? `r${pos}` : 'empty';
      const badgeText = pos || '·';
      h += `<div class="team-row ${posClass}" onclick="cycleTeam('${g}','${esc(t)}')">
        <span class="team-flag">
      <img src="${f(t)}" alt="${t}" width="22" height="16">
    </span>
    <span class="team-name">${t}</span>
    <span class="rank-badge ${badgeClass}">${badgeText}</span>
  </div>`;
    });
    h += `</div></div>`;
  });

  h += `</div>`;
  if(allGroupsDone()){
    h += `<div class="btn-bar"><button class="btn-gold btn" onclick="S.phase='third';render()">Pick best 3rd-place teams →</button></div>`;
  }
  return h;
}

function renderThird(){
  const thirds = GK.map(g => gt(g) ? {team:gt(g), group:g} : null).filter(Boolean);
  const chosen = S.thirds;
  const ok = chosen.length === 8;
  const over = chosen.length > 8;

  let h = `
    <div class="section-eyebrow">Phase 2</div>
    <div class="section-title">Best 3rd-Place Teams</div>
    <div class="section-desc">12 groups each produce a 3rd-place team — only 8 advance. Choose the 8 you believe deserve a spot in the Round of 32.</div>
    <div class="counter-chip"><strong>${chosen.length}/8</strong> selected</div>`;

  if(over) h += `<p class="err-msg">Too many selected — remove ${chosen.length-8} team(s)</p>`;

  h += `<div class="third-grid">`;
  thirds.forEach(({team, group}) => {
  const sel = chosen.includes(team);

  h += `<div class="third-card ${sel?'chosen':''}" onclick="toggleThird('${esc(team)}')">
    <span class="tc-check">✓</span>
    <div class="tc-flag">
      <img src="${f(team)}" alt="${team}" width="28" height="20">
    </div>
    <div class="tc-name">${team}</div>
    <div class="tc-from">Group ${group} · 3rd place</div>
  </div>`;
});
  h += `</div>`;
  h += `<div class="btn-bar">
    <button class="btn" onclick="S.phase='groups';render()">← Back</button>
    <button class="btn-gold btn" onclick="S.phase='r32';render()" ${ok?'':'disabled'}>Build bracket →</button>
  </div>`;
  return h;
}

function renderKnockoutRound(eyebrow, title, desc, matches, winBucket, wins, nextPhase, backPhase, r32Build){
  if(r32Build) matches = buildR32();
  const done = allDone(matches, wins);

  let h = `
    <div class="section-eyebrow">${eyebrow}</div>
    <div class="section-title">${title}</div>
    <div class="section-desc">${desc}</div>
    <div class="matches-grid">`;

  Object.entries(matches).forEach(([key,[t1,t2]]) => {
    const w = wins[key];
    const t1tbd = t1==='TBD', t2tbd = t2==='TBD';
    h += `<div class="match-card">
      <div class="match-id">${key.replace('_',' ')}</div>
      <div class="match-body">
        <div class="match-team ${w===t1?'winner':''} ${t1tbd?'tbd':''}"
  onclick="${!t1tbd?`pickWinner('${winBucket}','${key}','${esc(t1)}')`:''}" >

  <span class="mt-flag">
    <img src="${f(t1)}" alt="${t1}" width="26" height="18">
  </span>

  <span class="mt-name">${t1}</span>
  <span class="mt-check">✓</span>
</div>
        <div class="vs-line">VS</div>
        <div class="match-team ${w===t2?'winner':''} ${t2tbd?'tbd':''}"
  onclick="${!t2tbd?`pickWinner('${winBucket}','${key}','${esc(t2)}')`:''}" >

  <span class="mt-flag">
    <img src="${f(t2)}" alt="${t2}" width="26" height="18">
  </span>

  <span class="mt-name">${t2}</span>
  <span class="mt-check">✓</span>
</div>
      </div>
    </div>`;
  });

  h += `</div>
  <div class="btn-bar">
    <button class="btn" onclick="S.phase='${backPhase}';render()">← Back</button>
    ${done ? `<button class="btn-gold btn" onclick="S.phase='${nextPhase}';render()">Continue →</button>` : ''}
  </div>`;
  return h;
}

function renderFinal(){
  const m = buildFinal();
  const [t1,t2] = m.FINAL;
  let h = `
    <div class="section-eyebrow">The Final</div>
    <div class="section-title">Who Lifts the Trophy?</div>
    <div class="section-desc">Two nations. One match. Choose your World Cup champion.</div>
    <div style="max-width:320px;margin:0 auto">
    <div class="match-card" style="overflow:hidden">
      <div class="match-id" style="padding:10px 16px;font-size:0.75rem">FIFA WORLD CUP FINAL · 2026</div>
      <div class="match-body" style="padding:10px">
        <div class="match-team ${t1==='TBD'?'tbd':''}" 
     style="padding:12px 10px" 
     onclick="${t1!=='TBD'?`pickWinner('final','FINAL','${esc(t1)}')`:''}" >

  <span class="mt-flag">
    <img src="${f(t1)}" alt="${t1}" width="28" height="20">
  </span>

  <span class="mt-name" style="font-size:0.9rem;font-weight:500">${t1}</span>
</div>
        <div class="vs-line" style="padding:6px 0;font-size:0.75rem">FINAL</div>
        <div class="match-team ${t2==='TBD'?'tbd':''}" 
     style="padding:12px 10px" 
     onclick="${t2!=='TBD'?`pickWinner('final','FINAL','${esc(t2)}')`:''}" >

  <span class="mt-flag">
    <img src="${f(t2)}" alt="${t2}" width="28" height="20">
  </span>

  <span class="mt-name" style="font-size:0.9rem;font-weight:500">${t2}</span>
</div>
      </div>
    </div></div>
    <div class="btn-bar"><button class="btn" onclick="S.phase='sf';render()">← Back</button></div>`;
  return h;
}

function renderDone(){
  const champ = S.champion || '?';
  return `
    <div class="winner-screen">
      <div class="winner-trophy">🏆</div>
      <div class="winner-flag"> <img src="${f(champ)}" alt="${champ}" width="40" height="28">
</div>
      <div class="winner-team">${champ}</div>
      <div class="winner-label">Your 2026 FIFA World Cup Champion</div>
      <div class="winner-divider"></div>
      <p style="font-size:0.78rem;color:var(--muted);margin-bottom:1.5rem">Ready to try a different prediction?</p>
      <button class="btn-gold btn" onclick="resetAll()">Start Over</button>
    </div>`;
}

function resetAll(){
  S.phase='groups'; S.rankings={}; S.thirds=[];
  S.r32w={}; S.r16w={}; S.qfw={}; S.sfw={}; S.champion=null;
  render();
}

function render(){
  document.getElementById('progressBar').innerHTML = renderProgress();
  const app = document.getElementById('app');
  const p = S.phase;
  let html = '';
  if(p==='groups') html = renderGroups();
  else if(p==='third') html = renderThird();
  else if(p==='r32') html = renderKnockoutRound(
    'Phase 3','Round of 32','Click the team you think wins each match.',
    {}, 'r32', S.r32w, 'r16', 'third', true);
  else if(p==='r16') html = renderKnockoutRound(
    'Phase 4','Round of 16','The field narrows to 16. Pick your winners.',
    buildR16(), 'r16', S.r16w, 'qf', 'r32', false);
  else if(p==='qf') html = renderKnockoutRound(
    'Phase 5','Quarterfinals','Eight teams remain. Who makes the semis?',
    buildQF(), 'qf', S.qfw, 'sf', 'r16', false);
  else if(p==='sf') html = renderKnockoutRound(
    'Phase 6','Semifinals','Four nations. Two spots in the final.',
    buildSF(), 'sf', S.sfw, 'final', 'qf', false);
  else if(p==='final') html = renderFinal();
  else if(p==='done') html = renderDone();
  app.innerHTML = html;
}

window.cycleTeam = cycleTeam;
window.toggleThird = toggleThird;
window.pickWinner = pickWinner;
window.resetAll = resetAll;

render();
</script>
</body>
</html>
